[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "wheel",
    "setuptools>=45",
    "setuptools_scm[toml]>=6.0",
]

[project]
name = "robot-log-visualizer"
description = "Visualizer for robot logger"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Giulio Romualdi", email = "giulio.romualdi@gmail.com" },
]
keywords = [
    "robotics",
    "visualization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development",
    "Framework :: Robot Framework",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "idyntree >= 10.2.0",
    "meshcat",
    "numpy",
    "PySide6>=6.5,<7",
    "qtpy>=2.4",
    "pyqtconsole",
    "resolve-robotics-uri-py",
    "h5py",
    "pyqtgraph",
    "av",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/gbionics/robot-log-visualizer"
Changelog = "https://github.com/gbionics/robot-log-visualizer/releases"
Tracker = "https://github.com/gbionics/robot-log-visualizer/issues"
Source = "https://github.com/gbionics/robot-log-visualizer"

[project.scripts]
robot-log-visualizer = "robot_log_visualizer.__main__:main"

[tool.setuptools]
include-package-data = true
packages = { find = {} }

[tool.setuptools.package-data]
"*" = ["*.png", "*.svg", "*.ui"]

[tool.setuptools_scm]
local_scheme = "dirty-tag"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
robot-log-visualizer = { path = ".", editable = true }

[tool.pixi.tasks]
test = { cmd = "python -m pytest tests -q", description = "Check GUI startup, log loading, plotting, and playback without a display" }

[tool.pixi.dependencies]
pytest = "*"
numpy = "*"
qtpy = ">=2.4"
pyside6 = ">=6.10,<7"
qt6-webengine = ">=6.10,<7"
pyqtgraph = "*"
av = "*"
matplotlib = "*"
h5py = "*"
gst-plugins-good = "*"
gst-plugins-bad = "*"
gst-libav = "*"
idyntree = "*"
pyqtconsole = "*"
meshcat-python = "*"
resolve-robotics-uri-py = "*"

[tool.pixi.feature.pyqt5.dependencies]
pyqt = ">=5.15,<6"
pyqtwebengine = ">=5.15,<6"

[tool.pixi.feature.pyqt5.activation.env]
QT_API = "pyqt5"

[tool.pixi.environments]
default = []
pyqt5 = ["pyqt5"]

