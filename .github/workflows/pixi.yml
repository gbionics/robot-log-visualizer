name: Pixi tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.environment }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        environment: [default, pyqt5]

    steps:
      - uses: actions/checkout@v6
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          cache: true
          environments: ${{ matrix.environment }}
      - name: Run tests
        run: pixi run --locked -e ${{ matrix.environment }} test
